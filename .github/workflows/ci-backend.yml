name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**/*.py"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-backend:
    name: Backend Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit-backend
          - unit-gmaps
          - unit-osm
          - integration
          - e2e
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: dex_test
          POSTGRES_DB: dataextraction_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install temporalio==1.7.1
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run unit tests — backend (122 tests)
        if: matrix.suite == 'unit-backend'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: dex_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: dataextraction_test
          ENVIRONMENT: test
        run: |
          pytest tests/unit/backend/ -v --tb=short \
            --cov=packages --cov-report=xml --cov-fail-under=80

      - name: Run unit tests — gmaps (100 tests)
        if: matrix.suite == 'unit-gmaps'
        run: |
          pytest tests/unit/gmaps/ -v --tb=short

      - name: Run unit tests — osm (31 tests)
        if: matrix.suite == 'unit-osm'
        run: |
          pytest tests/unit/osm/ -v --tb=short

      - name: Run integration tests
        if: matrix.suite == 'integration'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: dex_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: dataextraction_test
          TEMPORAL_HOST: localhost:7233
          ENVIRONMENT: test
        run: |
          pytest tests/integration/ -v --tb=short -m "not requires_temporal"

      - name: Run end-to-end integration tests (16 tests)
        if: matrix.suite == 'e2e'
        run: |
          pytest tests/e2e/ -v --tb=short

      - name: Upload coverage report
        if: matrix.suite == 'unit-backend'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt mypy
      - run: mypy packages/temporal packages/agents --ignore-missing-imports --no-strict-optional

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check packages/ tests/ --output-format=github
