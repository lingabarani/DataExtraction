# Worker concurrency configuration
# These values are defaults; override via environment variables

workers:
  federal:
    task_queue: "federal-ingestion"
    max_concurrent_activities: 3        # Respect federal API rate limits
    max_concurrent_workflow_tasks: 10
    graceful_shutdown_timeout_seconds: 30

  gmaps:
    task_queue: "gmaps-extraction"
    max_concurrent_activities: 5
    max_concurrent_workflow_tasks: 20
    graceful_shutdown_timeout_seconds: 60

  osm:
    task_queue: "osm-extraction"
    max_concurrent_activities: 4
    max_concurrent_workflow_tasks: 10
    graceful_shutdown_timeout_seconds: 30

  pipeline:
    task_queue: "data-pipeline"
    max_concurrent_activities: 8
    max_concurrent_workflow_tasks: 20
    graceful_shutdown_timeout_seconds: 30

  storage:
    task_queue: "storage-ops"
    max_concurrent_activities: 10
    max_concurrent_workflow_tasks: 30
    graceful_shutdown_timeout_seconds: 15
