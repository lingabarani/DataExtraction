# Extraction schedule configuration
# These define the cron schedules registered with Temporal on startup

schedules:
  daily_federal:
    id: "daily-federal-ingestion"
    workflow: "FederalIngestionWorkflow"
    task_queue: "federal-ingestion"
    cron: "0 2 * * *"          # 2:00 AM UTC daily
    input:
      mode: "incremental"
    paused: false

  weekly_gmaps:
    id: "weekly-gmaps-extraction"
    workflow: "GMapsExtractionWorkflow"
    task_queue: "gmaps-extraction"
    cron: "0 1 * * 0"          # Sunday 1:00 AM UTC
    input:
      mode: "incremental"
      regions: "all"
      categories:
        - restaurant
        - hotel
        - retail
        - healthcare
        - professional_services
    paused: false

  monthly_osm:
    id: "monthly-osm-extraction"
    workflow: "OSMStateWorkflow"
    task_queue: "osm-extraction"
    cron: "0 3 1 * *"          # 1st of month, 3:00 AM UTC
    input:
      scope: "full"
      states: "all_50_us"
    paused: false

  weekly_dlq_replay:
    id: "weekly-dlq-replay"
    workflow: "DLQReplayWorkflow"
    task_queue: "storage-ops"
    cron: "0 4 * * 1"          # Monday 4:00 AM UTC
    input:
      limit: 1000
      mode: "auto"
    paused: false

  nightly_email_enrichment:
    id: "nightly-canonical-email-enrichment"
    workflow: "EmailEnrichmentWorkflow"
    task_queue: "email-enrichment-queue"
    cron: "0 3 * * *"          # 3:00 AM UTC (strictly after deduplication)
    input:
      batch_size: 500
      max_records: 5000
      probe_smtp: true
      verify_dedup_completed: true
    paused: false

  daily_freshness_revalidation:
    id: "daily-freshness-revalidation-sweep"
    workflow: "RevalidationSweepWorkflow"
    task_queue: "governance-quality-queue"
    cron: "0 2 * * *"          # 2:00 AM UTC daily
    input:
      batch_size: 5000
      freshness_threshold: 0.70
      auto_reharvest: true
    paused: false
