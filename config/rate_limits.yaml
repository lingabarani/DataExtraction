# Per-source API rate limit configuration

rate_limits:
  sec_edgar:
    requests_per_second: 10
    requests_per_day: 500000
    retry_after_429_seconds: 5
    user_agent_required: true    # SEC requires proper User-Agent

  cms_npi:
    requests_per_second: 100
    max_limit_per_run: 50000
    retry_after_429_seconds: 2

  sam_gov:
    requests_per_second: 1       # Very conservative — API key required
    requests_per_day: 10000
    retry_after_429_seconds: 60

  fdic:
    requests_per_second: 20
    requests_per_day: 100000
    retry_after_429_seconds: 5

  usaspending:
    requests_per_second: 50
    requests_per_day: 200000
    retry_after_429_seconds: 5

  propublica:
    requests_per_second: 50
    requests_per_day: 100000
    retry_after_429_seconds: 5

  google_maps_platform:
    places_api_per_minute: 600
    daily_budget_usd: 50.0       # Hard cap — exceeding this triggers automatic disable
    cache_ttl_days: 30

  gmaps_local:                   # Local Maps scraping (no external API)
    concurrent_tiles: 4
    tile_retry_count: 3
    request_delay_ms: 500

  osm:
    overpass_api_per_minute: 60
    nominatim_per_minute: 60
    retry_delay_seconds: 10

  email_enrichment:
    requests_per_second: 50.0
    per_host_limit: 2
    total_timeout_seconds: 10.0
    max_body_size_bytes: 5242880

  smtp_probe:
    timeout_seconds: 5.0
    max_mx_hosts: 3
    candidate_prefixes:
      - info
      - contact
      - sales
      - hello
      - office
      - support
      - inquiries

  # Discovery Engine Source Limits
  discovery_linkedin_public:
    requests_per_second: 0.5
    burst: 2
    hourly_cap: 60
    retry_after_429_seconds: 60

  discovery_linkedin_voyager:
    requests_per_hour: 30
    retry_after_429_seconds: 300

  discovery_geocode:             # OpenStreetMap Nominatim: policy maximum is 1 request per second
    requests_per_second: 1.0
    burst: 1
  discovery_gmaps:               # Live Discovery Google Maps pages (up to 24 per search)
    requests_per_second: 8.0
    burst: 12
  discovery_web_search:
    requests_per_second: 1.0
    burst: 3

  discovery_cms:
    requests_per_second: 5.0
    burst: 10

  discovery_state_registry:
    requests_per_second: 5.0
    burst: 10

  discovery_website_crawl:
    per_host_limit: 2
    requests_per_second: 10.0
    max_pages_per_domain: 5

