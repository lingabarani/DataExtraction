version: "3.9"

# DataExtraction — Full 7-container production stack
# Usage: docker compose up -d
# Temporal UI: http://localhost:8233
# API Docs:    http://localhost:8000/api/docs
# Frontend:    http://localhost:3000

networks:
  dataextraction:
    driver: bridge

volumes:
  postgres_data:
  temporal_data:
  minio_data:

  ollama_data:

services:

  # ── PostgreSQL 15 + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: dex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataextraction}
      POSTGRES_USER: ${POSTGRES_USER:-dex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dex_user} -d ${POSTGRES_DB:-dataextraction}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataextraction

  # ── PgBouncer Connection Pooler ──────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.21.0
    container_name: dex-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    networks:
      - dataextraction

  # ── MinIO S3 Object Storage (Lakehouse Observation Store) ─────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: dex-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LAKEHOUSE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LAKEHOUSE_SECRET_KEY:-miniopassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dataextraction

  # ── MinIO Auto-Bucket Provisioner ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-31-07Z
    container_name: dex-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $${LAKEHOUSE_ACCESS_KEY:-minioadmin} $${LAKEHOUSE_SECRET_KEY:-miniopassword}; do
        echo 'Waiting for MinIO S3 API to become ready...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/$${LAKEHOUSE_BUCKET_NAME:-dataextraction-lakehouse};
      echo 'Lakehouse observation bucket verified.';
      exit 0;
      "
    networks:
      - dataextraction

  # ── Ollama LLM Inference Engine (Llama 3.1 8B) ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: dex-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dataextraction
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Ollama Model Auto-Provisioner (Pulls model on bootstrap) ─────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: dex-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Verifying Ollama model availability...';
      if ! ollama list | grep -q '${OLLAMA_MODEL:-llama3.1:8b}'; then
        echo 'Pulling model ${OLLAMA_MODEL:-llama3.1:8b}...';
        ollama pull ${OLLAMA_MODEL:-llama3.1:8b};
      fi;
      echo 'Ollama model readiness confirmed.';
      exit 0;
      "
    networks:
      - dataextraction

  # ── Temporal Server (auto-setup with PostgreSQL persistence) ─────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: dex-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-dex_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - ./config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dataextraction

  # ── Temporal Web UI ──────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: dex-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"
    networks:
      - dataextraction

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: dex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/infrastructure:/app/packages/infrastructure
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 1 - Official Registry Intelligence ────────────────
  worker-registry:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-registry
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=registry
    command: ["python", "-m", "packages.temporal.workers.worker_registry"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 2 - Geospatial & Domain Intelligence ──────────────
  worker-geospatial:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-geospatial
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=geospatial
    command: ["python", "-m", "packages.temporal.workers.worker_geospatial"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 3 - Identity Resolution & Clustering ──────────────
  worker-identity:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-identity
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=identity
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    command: ["python", "-m", "packages.temporal.workers.worker_identity"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 4 - Executive Discovery & Contact Intelligence ─────
  worker-executive:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-executive
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=executive
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    command: ["python", "-m", "packages.temporal.workers.worker_executive"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 5 - Governance, Quality & Confidence Engine ────────
  worker-governance:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-governance
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=governance
    command: ["python", "-m", "packages.temporal.workers.worker_governance"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 6 - Persistence, CDC & Search Synchronization ──────
  worker-search:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-search
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=search
    command: ["python", "-m", "packages.temporal.workers.worker_search"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 7 - Post-Dedup Email Discovery & Verification ──────
  worker-email-enrichment:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-email-enrichment
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=email_enrichment
    command: ["python", "-m", "packages.temporal.workers.worker_email_enrichment"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Federal Ingestion (Legacy compatibility) ────────────────
  worker-federal:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-federal
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=federal
    command: ["python", "-m", "packages.temporal.workers.federal_worker"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: GMaps Extraction (Legacy compatibility) ─────────────────
  worker-gmaps:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-gmaps
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=gmaps
    command: ["python", "-m", "packages.temporal.workers.gmaps_worker"]
    volumes:
      - ./packages:/app/packages
    networks:
      - dataextraction

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  web:
    build:
      context: packages/frontend
      dockerfile: ../../infra/docker/Dockerfile.frontend
    container_name: dex-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - dataextraction
