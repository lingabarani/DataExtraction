version: "3.9"

# DataExtraction — Full production stack
# =========================================================================
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#
# Service endpoints:
#   API Docs      : http://localhost:8000/api/docs
#   Frontend      : http://localhost:3000
#   Temporal UI   : http://localhost:8233
#   MinIO Console : http://localhost:9001
#   OpenSearch    : http://localhost:9200
#   Grafana       : http://localhost:3002  (see docker-compose.monitoring.yml)
# =========================================================================

networks:
  dataextraction:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  opensearch_data:

services:

  # ── PostgreSQL 15 + PostGIS ──────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: dex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataextraction}
      POSTGRES_USER: ${POSTGRES_USER:-dex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dex_user} -d ${POSTGRES_DB:-dataextraction}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dataextraction

  # ── PgBouncer Connection Pooler ──────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.21.0
    container_name: dex-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Pass credentials from env so userlist.txt can be generated by entrypoint
      DATABASE_URL: "postgres://${POSTGRES_USER:-dex_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dataextraction}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "30"
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "6432:6432"
    networks:
      - dataextraction

  # ── Redis (session cache, distributed rate limiter) ──────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: dex-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataextraction

  # ── MinIO S3 Object Storage (Lakehouse) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: dex-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LAKEHOUSE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LAKEHOUSE_SECRET_KEY:-miniopassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # Use curl instead of mc since minio/minio image may not ship mc with 'ready' subcommand
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dataextraction

  # ── MinIO Auto-Bucket Provisioner ────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-31-07Z
    container_name: dex-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${LAKEHOUSE_ACCESS_KEY:-minioadmin} $${LAKEHOUSE_SECRET_KEY:-miniopassword};
      /usr/bin/mc mb --ignore-existing local/$${LAKEHOUSE_BUCKET_NAME:-dataextraction-lakehouse};
      /usr/bin/mc anonymous set download local/$${LAKEHOUSE_BUCKET_NAME:-dataextraction-lakehouse};
      echo 'Lakehouse bucket verified.';
      "
    networks:
      - dataextraction

  # ── OpenSearch 2.x (CDC search engine) ───────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: dex-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true   # simplify local dev; enable in production
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dataextraction

  # ── Ollama LLM Inference Engine (Llama 3.1 8B) ───────────────────────────
  # GPU is optional — set OLLAMA_ENABLED=false to skip LLM features entirely.
  ollama:
    image: ollama/ollama:latest
    container_name: dex-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dataextraction
    # GPU is optional — remove the deploy block if no GPU is available
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Ollama (CPU-only fallback, no GPU required) ───────────────────────────
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: dex-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dataextraction
    profiles:
      - default
      - cpu

  # ── Ollama Model Auto-Provisioner ─────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: dex-ollama-init
    restart: "no"
    depends_on:
      ollama-cpu:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Checking Ollama model availability...';
      if ! ollama list 2>/dev/null | grep -q '${OLLAMA_MODEL:-llama3.1:8b}'; then
        echo 'Pulling ${OLLAMA_MODEL:-llama3.1:8b}...';
        OLLAMA_HOST=http://dex-ollama:11434 ollama pull ${OLLAMA_MODEL:-llama3.1:8b};
      fi;
      echo 'Ollama model ready.';
      "
    networks:
      - dataextraction
    profiles:
      - default
      - cpu

  # ── Temporal Server (PostgreSQL persistence) ─────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: dex-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-dex_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - ../config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health 2>/dev/null | grep -q SERVING || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - dataextraction

  # ── Temporal Namespace Initializer ───────────────────────────────────────
  temporal-namespace-init:
    image: temporalio/admin-tools:1.24.2
    container_name: dex-temporal-ns-init
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    entrypoint: >
      /bin/sh -c "
      echo 'Creating Temporal namespace: ${TEMPORAL_NAMESPACE:-dataextraction}';
      temporal operator namespace create ${TEMPORAL_NAMESPACE:-dataextraction} \
        --description 'DataExtraction enterprise orchestration namespace' || true;
      echo 'Namespace ready.';
      "
    networks:
      - dataextraction

  # ── Temporal Web UI ───────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: dex-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"
    networks:
      - dataextraction

  # ── FastAPI Backend (port 8000) ───────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    container_name: dex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      - OLLAMA_BASE_URL=http://dex-ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - API_PORT=8000
    volumes:
      - ../packages/api:/app/packages/api
      - ../packages/infrastructure:/app/packages/infrastructure
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 1 — Registry Harvester ────────────────────────
  worker-registry:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-registry
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=registry
    command: ["python", "-m", "packages.temporal.workers.worker_registry"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 2 — Geospatial & Domain Intelligence ──────────
  worker-geospatial:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-geospatial
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=geospatial
    command: ["python", "-m", "packages.temporal.workers.worker_geospatial"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 3 — Identity Resolution & Clustering ──────────
  worker-identity:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-identity
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=identity
      - OLLAMA_BASE_URL=http://dex-ollama:11434
    command: ["python", "-m", "packages.temporal.workers.worker_identity"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 4 — Executive Discovery & Contact Intelligence ─
  worker-executive:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-executive
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=executive
      - OLLAMA_BASE_URL=http://dex-ollama:11434
    command: ["python", "-m", "packages.temporal.workers.worker_executive"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 5 — Governance, Quality & Confidence Engine ───
  worker-governance:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-governance
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=governance
    command: ["python", "-m", "packages.temporal.workers.worker_governance"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 6 — Persistence, CDC & Search Synchronization ─
  worker-search:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-search
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=search
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
    command: ["python", "-m", "packages.temporal.workers.worker_search"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Agent 7 — Email Discovery & Verification ────────────
  worker-email-enrichment:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-email-enrichment
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=email_enrichment
    command: ["python", "-m", "packages.temporal.workers.worker_email_enrichment"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: Federal Ingestion ───────────────────────────────────
  worker-federal:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-federal
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=federal
    command: ["python", "-m", "packages.temporal.workers.federal_worker"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Temporal Worker: GMaps Extraction ────────────────────────────────────
  worker-gmaps:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: dex-worker-gmaps
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - WORKER_TYPE=gmaps
    command: ["python", "-m", "packages.temporal.workers.gmaps_worker"]
    volumes:
      - ../packages:/app/packages
    networks:
      - dataextraction

  # ── Next.js Frontend (port 3000) ─────────────────────────────────────────
  web:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
      args:
        # API URL as seen by the browser — always the external port 8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-DataExtraction}
    container_name: dex-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - dataextraction
