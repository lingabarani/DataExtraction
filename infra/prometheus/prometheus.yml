# =============================================================================
# DataExtraction — Prometheus Observability Configuration
# =============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # 1. FastAPI Application Server & Observability Endpoint
  - job_name: "dataextraction-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api:8000"
          - "host.docker.internal:8000"
          - "localhost:8000"
        labels:
          environment: "production"
          service: "dataextraction-api"
          tier: "backend"

  # 2. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # 3. PostgreSQL Database Exporter (when running)
  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgresql"
          tier: "database"

