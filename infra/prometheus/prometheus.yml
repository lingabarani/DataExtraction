# =============================================================================
# DataExtraction — Prometheus Observability Configuration
# =============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # 1. FastAPI Application Server & Observability Endpoint
  - job_name: "dataextraction-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api:8000"
          - "host.docker.internal:8000"
          - "localhost:8000"
        labels:
          environment: "production"
          service: "dataextraction-api"
          tier: "backend"

  # 2. Agent 2 Geospatial Temporal Worker Metrics Endpoint
  - job_name: "worker-geospatial"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "worker-geospatial:9102"
          - "host.docker.internal:9102"
          - "localhost:9102"
        labels:
          environment: "production"
          service: "worker-geospatial"
          tier: "worker"
          agent: "agent2"

  # 3. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # 3. PostgreSQL Database Exporter (when running)
  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgresql"
          tier: "database"

