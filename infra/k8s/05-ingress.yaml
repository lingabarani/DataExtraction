apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oneextraction-ingress
  namespace: oneextraction
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.oneextraction.io
      secretName: oneextraction-tls-cert
  rules:
    - host: app.oneextraction.io
      http:
        paths:
          # Backend API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: oneextraction-api-service
                port:
                  number: 3001
          # Prometheus metrics (internal monitoring)
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: oneextraction-api-service
                port:
                  number: 3001
          # Frontend Web Dashboard (default)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oneextraction-web-service
                port:
                  number: 3000
