apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneextraction-api
  namespace: oneextraction
  labels:
    app: oneextraction-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: oneextraction-api
  template:
    metadata:
      labels:
        app: oneextraction-api
    spec:
      containers:
        - name: api
          image: ghcr.io/oneextraction/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: oneextraction-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oneextraction-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oneextraction-secrets
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oneextraction-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: oneextraction-api-service
  namespace: oneextraction
  labels:
    app: oneextraction-api
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: oneextraction-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oneextraction-api-hpa
  namespace: oneextraction
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oneextraction-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
