# ==============================================================================
# DataExtraction: Phase 5 Autoscaled Distributed Worker Fleet (HPA)
# ==============================================================================
# 7 Independent Worker Deployments decoupled by task queue with dedicated HPAs.
# ==============================================================================

# ── Worker 1: Registry Ingestion Fleet ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-registry
  namespace: oneextraction
  labels:
    app: worker-registry
    tier: orchestration-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-registry
  template:
    metadata:
      labels:
        app: worker-registry
    spec:
      containers:
        - name: worker
          image: ghcr.io/oneextraction/worker:latest
          command: ["python", "-m", "packages.temporal.workers.worker_registry"]
          envFrom:
            - configMapRef:
                name: oneextraction-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oneextraction-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1.5Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-registry-hpa
  namespace: oneextraction
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-registry
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

