apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: oneextraction
data:
  pgbouncer.ini: |
    [databases]
    dataextraction = host=postgres-service port=5432 dbname=dataextraction auth_user=postgres
    
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 30
    min_pool_size = 10
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    max_db_connections = 60
    server_idle_timeout = 60
    server_lifetime = 3600
    server_reset_query = DISCARD ALL
  userlist.txt: |
    "postgres" "SCRAM-SHA-256$4096:5a9c8b7e...==$..."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: oneextraction
  labels:
    app: pgbouncer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.22.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6432
              name: pgbouncer
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-service
  namespace: oneextraction
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
  selector:
    app: pgbouncer

