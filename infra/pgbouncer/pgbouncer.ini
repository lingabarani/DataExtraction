[databases]
# Route all connections for the dataextraction database through PgBouncer.
# POSTGRES_USER and POSTGRES_DB are injected via environment at container start.
dataextraction = host=postgres port=5432 dbname=dataextraction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# Auth: use the same user as the main application DB user (dex_user, not postgres)
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Transaction-mode pooling is optimal for connection multiplexing
pool_mode = transaction

max_client_conn = 1000
default_pool_size = 30
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 60

server_idle_timeout = 60
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
