version: "3.9"

# DataExtraction — Temporal-only dev stack
# Run this when you only need Temporal (not the full platform)
# Usage: docker compose -f infra/docker-compose.temporal.yml up -d

networks:
  temporal-dev:
    driver: bridge

services:
  postgres-temporal:
    image: postgres:15
    container_name: dex-temporal-postgres
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - temporal-dev

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: dex-temporal-dev
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres-temporal
    ports:
      - "7233:7233"
    networks:
      - temporal-dev

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: dex-temporal-ui-dev
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"
    networks:
      - temporal-dev
