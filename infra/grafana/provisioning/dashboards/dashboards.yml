# =============================================================================
# DataExtraction — Grafana Dashboard Provider Configuration
# =============================================================================
apiVersion: 1

providers:
  - name: "DataExtraction Telemetry"
    orgId: 1
    folder: "DataExtraction Platform"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

