5GqGGHY"},"interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":6627},"url":"https://www.linkedin.com/pulse/delivering-3-trusted-platforms-ai-age-satya-nadella-uijzc"},{"@type":"Article","author":{"@type":"Person","name":"Satya Nadella","url":"https://www.linkedin.com/in/satyanadella"},"dateModified":"","datePublished":"2024-10-24T21:07:04.000+00:00","headline":"My annual letter: Relevance and reinvention","image":{"@type":"ImageObject","url":"https://media.licdn.com/dms/image/v2/D5612AQGBq-5ghVzUrg/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1729800206993?e=2147483647&v=beta&t=QHJqp-aqm16yc1xO5_fKadOzXPkRqt12Ho0i8Jwoghs"},"interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":4790},"url":"https://www.linkedin.com/pulse/my-annual-letter-relevance-reinvention-satya-nadella-v91xc"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Satya Nadella","url":"https://www.linkedin.com/in/satyanadella"},"datePublished":"2026-10-28T22:56:51.348Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":14426},"mainEntityOfPage":"https://www.linkedin.com/posts/satyanadella_just-wrapped-our-earnings-call-it-was-a-activity-7521344259774660609-7i67","text":"Just wrapped our earnings call. It was a fast start to our fiscal year.\n \nMicrosoft Cloud revenue surpassed $63B, with growth accelerating to 30% YoY. \n\nLots of innovation as we build the new tech stack for the agentic wave. A few highlights:\n \nFirst, we announced our biggest update to Copilot to date, bringing together Chat, Cowork, Autopilot, and Code into one unified experience: \n\n• Daily users grew nearly 50% QoQ, and more than 5X YoY. \n• User satisfaction improved nearly 20% QoQ to another all-time high \n• Number of customers with more than 50K Copilot seats, up 8X YoY \n\nGreat momentum with GitHub Copilot too, including Copilot Fusion, announced just this morning, which delivers frontier level quality, at up to 77% lower cost. \n\nAnd this is just the beginning. The next frontier is maximizing intelligence per task while continuously optimizing for cost and performance. \n \nThis is the frontier that will matter to companies! \n \nAnd we are extending our vision of Copilot as the new OS for work, bringing the business logic and capabilities of D365 directly into Copilot, helping every organization stand up their own infinite SaaS factory. \n\nSecond, underneath our 1P experiences is a common platform, starting with Foundry, which is becoming an increasingly important driver of our growth: \n\n• Foundry revenue more than tripled YoY \n• Number of customers building with multiple models grew 5X YoY \n• Revenue from open source models increased 10X YoY \n\nWe're also bringing Foundry and Fabric closer together, so customers can build agents right next to their data. \n\nAnd with Microsoft IQ, we're making the rich enterprise context underneath Microsoft 365 + Foundry + Fabric available to agentic workloads. \n\nNearly 60K customers are accessing context across Microsoft IQ, up 25% QoQ. \n\nThird, we’re also helping customers secure and govern their agents at scale. \n\nOver 50M agents are now in A365, up 30% QoQ. \n\nWe are also bringing together Windows + Agent 365 so agents can work within secure boundaries on-device using MXC.  \n\nAgents like OpenAI Codex, Anthropic Claude Code, and Meta Muse are all adopting it. \n\nAnd with Perception, we’re separating intelligence from authority, enforcing identity, permissions, monitoring and containment outside the model itself. We’re encouraged by the feedback from preview customers. \n\nLast, when it comes to infrastructure, we have a fungible fleet that allows us to dynamically allocate capacity to the highest value opportunities across compute, data, Foundry, and Copilot. \n\nWe are bringing capacity online faster, and getting more from the infrastructure we already have. \n\nAzure growth was broad-based across enterprise and SMB, spanning both core cloud services and AI infra. \n\nI have never been more confident in the opportunity ahead of us. \n\nRead more about our results here: https://lnkd.in/gVpbWFZK","url":"https://www.linkedin.com/posts/satyanadella_just-wrapped-our-earnings-call-it-was-a-activity-7521344259774660609-7i67"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Satya Nadella","url":"https://www.linkedin.com/in/satyanadella"},"datePublished":"2026-10-28T17:09:15.772Z","headline":"","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":10827},"mainEntityOfPage":"https://www.linkedin.com/posts/satyanadella_were-redefining-the-sdlc-for-the-agentic-activity-7521256785148706816-gkgs","text":"We're redefining the SDLC for the agentic era. \n\nLots of GitHub updates this morning at Universe:\n\n• GitHub Copilot Fusion delivers frontier-level quality, 40% faster and at up to 77% lower cost\n• Our unified Copilot harness is now in Foundry, a managed service for building long-running agents that reason, use tools, and get work done\n• Copilot Projects gives you an orchestration loop to build with multiple agents across repos\n\nAnd we’re expanding capacity and strengthening GitHub’s architecture to make the home of agentic development more resilient.\n\nRead more: https://lnkd.in/gvtEeair","url":"https://www.linkedin.com/posts/satyanadella_were-redefining-the-sdlc-for-the-agentic-activity-7521256785148706816-gkgs"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Satya Nadella","url":"https://www.linkedin.com/in/satyanadella"},"datePublished":"2026-10-23T16:29:08.068Z","interactionStatistic":{"@type":"InteractionCounter","int
