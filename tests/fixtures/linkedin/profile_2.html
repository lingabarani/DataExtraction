nStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":7631},"url":"https://www.linkedin.com/pulse/were-entering-golden-age-alzheimers-research-bill-gates-7re2e"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-11-01T23:25:56.459Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1363},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_world-bank-says-small-ai-could-transform-activity-7522801130767224832-2eZH","text":"Useful advice for farmers, in their own language, on a phone they already have in their pocket. That’s the type of AI I’m excited about.","url":"https://www.linkedin.com/posts/williamhgates_world-bank-says-small-ai-could-transform-activity-7522801130767224832-2eZH"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-31T17:55:27.296Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1422},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_millions-of-children-arent-getting-vaccinated-activity-7522355573359558657-snZT","text":"We have vaccines that can save children’s lives, but 13.5 million kids have never received a single dose. Many live in remote areas that are hard for health workers to reach. Through a combination of household surveys, vaccination records, and satellite maps, we can figure out where children are being missed and get more of them the vaccines they need to survive and thrive.","url":"https://www.linkedin.com/posts/williamhgates_millions-of-children-arent-getting-vaccinated-activity-7522355573359558657-snZT"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-30T21:13:10.020Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1653},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_tests-and-treatments-for-alzheimers-bill-activity-7522042941364858880-eSmt","text":"Last weekend I caught up with a group of Alzheimer’s experts to hear how their work is going. Two things stood out. The science and development are making exciting progress. But the system isn’t keeping up, and too many patients aren’t benefiting from these breakthroughs yet.","url":"https://www.linkedin.com/posts/williamhgates_tests-and-treatments-for-alzheimers-bill-activity-7522042941364858880-eSmt"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-30T02:39:38.639Z","headline":"","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1165},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_the-details-matter-especially-when-it-comes-activity-7521762714126536704-U-O5","text":"The details matter, especially when it comes to health. But in many places, a majority of deaths are never recorded—and ones that are rarely list a cause.\n\nAt Healthy Sierra Leone (HEAL-SL), verbal autopsy surveyors like Andrew Moseray travel to communities to ask families an impossibly hard question: Has anyone in this household died? The responses they get help experts form hypotheses about mortality causes in the country that they can then test with more rigorous, reliable methods. What they learn helps inform further research and save future lives: https://lnkd.in/eHG9WYUb","url":"https://www.linkedin.com/posts/williamhgates_the-details-matter-especially-when-it-comes-activity-7521762714126536704-U-O5"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-30T01:13:04.368Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":384},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_congratulations-the-honorable-mark-dybul-activity-7521740927770562560-EplJ","text":"Congratulations, The Honorable Mark Dybul, MD. The Global Fund's commitment to working with countries to end AIDS, tuberculosis, and malaria is incredible. Your expertise will continue to accelerate that progress.","url":"https://www.linkedin.com/posts/williamhgates_congratulations-the-honorable-mark-dybul-activity-7521740927770562560-EplJ"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-27T21:57:34.172Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":980},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_good-news-and-bad-news-on-world-polio-day-activity-7520966952035454976-mM6k","text":"I’ve been focused on the fight against polio for over 20 years. Here’s where things stand: https://lnkd.in/erTRsCTQ","url":"https://www.linkedin.com/posts/williamhgates_good-news-and-bad-news-on-world-polio-day-activity-7520966952035454976-mM6k"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-27T18:15:03.484Z","headline":"","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1951},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_i-met-an-incredible-group-of-healthcare-professionals-activity-7520910955187212290-ceq3","text":"I met an incredible group of healthcare professionals in London on Friday. Some work in their local health clinics and others are researching infectious diseases like malaria or providing emergency pediatric care to children. What unites them is a shared commitment to improving health in their own communities and around the world.\n\nIt’s easy to talk about health at home and health around the world as separate issues. But it was good to hear from them how closely connected they are.\n\nIt was inspiring to hear how they are partnering with other countries to share best practice and using their voice to make the case for global health.","url":"https://www.linkedin.com/posts/williamhgates_i-met-an-incredible-group-of-healthcare-professionals-activity-7520910955187212290-ceq3"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Bill Gates","url":"https://www.linkedin.com/in/williamhgates"},"datePublished":"2026-10-25T21:50:38.240Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1901},"mainEntityOfPage":"https://www.linkedin.com/posts/williamhgates_the-4-next-big-things-in-food-and-agriculture-activity-7520240431754969089-6Rvr","text":"Agriculture is one area where AI is already having an impact, especially in countries where many people depend on farming for their livelihoods. When we talk about AI's potential for good, this is the kind of progress I'm excited to see:","url":"https://www.linkedin.com/posts/williamhgates_the-4-next-big-things-in-food-and-agriculture-activity-7520240431754969089-6Rvr"},{"@type":"WebPage","reviewedBy":{"@type":"Person","name":"Bill Gates"},"url":"https://www.linkedin.com/in/williamhgates"},{"@context":"http://schema.org","@type":"Person","ad
