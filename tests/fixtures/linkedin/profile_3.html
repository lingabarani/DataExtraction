,"interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":5958},"url":"https://www.linkedin.com/pulse/always-learning-linkedin-acquire-lyndacom-jeff-weiner"},{"@type":"Article","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"dateModified":"","datePublished":"2015-03-10T02:40:30.000+00:00","headline":"How LinkedIn is Helping Power the President's Tech Jobs Initiative","image":{"@type":"ImageObject"},"interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":624},"url":"https://www.linkedin.com/pulse/how-linkedin-helping-power-presidents-tech-jobs-jeff-weiner"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-11-01T14:55:45.158Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":313},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_bosses-want-the-secrets-of-the-family-firm-activity-7522672737660862464-vmp4","text":"Great read and case study on how doing good and doing well are not mutually exclusive, the value of basing performance evaluation on both the what and the how, and the benefits of compassionate management. Would be very interested in hearing how their playbook evolves with AI and robotics. \n\nhttps://lnkd.in/d6KSxJA8","url":"https://www.linkedin.com/posts/jeffweiner08_bosses-want-the-secrets-of-the-family-firm-activity-7522672737660862464-vmp4"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-08-28T16:57:18.173Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1521},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_seeing-lots-of-content-about-dolly-parton-activity-7499148115615350784-j-4g","text":"Seeing lots of content about Dolly Parton across multiple channels over the last few days and rightfully so. She was an extraordinary human being who touched millions of people in countless ways. \n\nI’ve long been interested in helping expand collective wisdom and compassion. Seemingly separately, I’ve also been an admirer of Dolly’s unique approach to her artistry, business and philanthropic efforts. However, it was only after her passing, and seeing so many of these heartfelt and thoughtful testimonies, stories and interviews, that it occurred to me how rarely I’ve seen an individual so profoundly embody both wisdom and compassion. She was a remarkable person who leaves a legacy worth emulating, perhaps now more than ever. ","url":"https://www.linkedin.com/posts/jeffweiner08_seeing-lots-of-content-about-dolly-parton-activity-7499148115615350784-j-4g"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-05-07T14:08:32.265Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":505},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_this-the-ai-hype-cycle-keeps-revealing-activity-7458155815695450112-lGxf","text":"This. \n\n\u003C\u003CThe AI hype cycle keeps revealing the same blind spot: we are very good at noticing the visible output of human activity, and very bad at noticing what makes that output meaningful. When the dust settles, I hope one of the outcomes will be a stronger, more precise understanding of what human qualities are not reducible to software.\u003E\u003E","url":"https://www.linkedin.com/posts/jeffweiner08_this-the-ai-hype-cycle-keeps-revealing-activity-7458155815695450112-lGxf"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-04-22T16:44:35.403Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":4265},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_earlier-today-ryan-roslansky-announced-he-activity-7452759269550137344-SFFT","text":"Earlier today, Ryan Roslansky announced he’ll be stepping down from the role of LinkedIn’s CEO and handing the reins to long time LinkedIn executive Daniel Shapero as Ryan focuses exclusively on his role as EVP at Microsoft. \n\nI’ve now had the privilege of working with Ryan for the last 25 years. He was the second person brought on to our newly created operating team at Yahoo (kudos Andrew Braccia), and the first hire I made after becoming CEO at LinkedIn. \n\nIn addition to being one of the best product people and systems thinkers I’ve worked with, his combination of talent, humility and integrity have always set him apart. At LinkedIn, he quickly grew from product manager, to product leader, to executive team member before ultimately becoming the CEO himself. From Covid through the AI era, he successfully led LinkedIn through one of the most tumultuous periods in recent corporate times. Despite those formidable challenges, he made the role completely his own, continued to build out a world-class team, and helped take the company to new heights across every meaningful measure. More importantly, he has set up  LinkedIn for even greater success in the future and leaves it in Dan’s very capable hands. \n\nRyan, congrats on your extraordinary tenure at LinkedIn, and thank you for always being such an incredible colleague and friend. Looking forward to much more of the same in the future.","url":"https://www.linkedin.com/posts/jeffweiner08_earlier-today-ryan-roslansky-announced-he-activity-7452759269550137344-SFFT"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-03-31T15:19:23.724Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":210},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_jpmorganchase-launches-american-dream-initiative-activity-7444765296588107776-aoLD","text":"Great to see. Jamie, the more you make this a platform play and make it easy for third party companies with a similar sense of purpose to participate, the better.\n\nhttps://lnkd.in/dNVSqSpU?","url":"https://www.linkedin.com/posts/jeffweiner08_jpmorganchase-launches-american-dream-initiative-activity-7444765296588107776-aoLD"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-03-04T17:50:05.527Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":316},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_mumford-sons-here-ft-sierra-ferrell-activity-7435018748249612288-uGkx","text":"Among the seemingly endless and warranted debates about what AI will and won’t disrupt, Mumford & Sons’ newest album Prizefighter is an inspiring reminder of what great art has and hopefully always will be: an undefinable combination of human creativity, imperfection and connection.","url":"https://www.linkedin.com/posts/jeffweiner08_mumford-sons-here-ft-sierra-ferrell-activity-7435018748249612288-uGkx"},{"@context":"https://schema.org","@type":"DiscussionForumPosting","author":{"@type":"Person","name":"Jeff Weiner","url":"https://www.linkedin.com/in/jeffweiner08"},"datePublished":"2026-02-26T02:08:49.771Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":1284},"mainEntityOfPage":"https://www.linkedin.com/posts/jeffweiner08_at-a-time-of-unprecedented-rate-of-change-activity-7432607544579084288-sZVy","text":"At a time of unprecedented rate of change and uncertainty in the software industry, it's not surprising to see two founding CEOs with the most prescient and enduring start-up visions over the last 12+ years, Dylan Field and Ivan Zhao, evolving their company's strategies so quickly and effectively. \n\nWithin the last two weeks, both introduced products with potentially game changing implications: Figma with Claude to Canvas and Notion with Custom Agents. The launches are representative of the future role of SaaS in an increasingly AI-centric world: adding value to the customer regardless of functional role, starting point, and perhaps most importantly, as agentic infrastructure. \n\nIt's also interesting to note that while some established companies are simply staying the course, avoiding the new reality, and/or being outright dismissive of its impact, both Dylan and Ivan have put clear stakes in the ground with regard to emerging first principles. Dylan recently suggested that \"Design is the new code\" while Ivan stated that \"If your product cannot be used by agents, I don't think the future is very promising for you.\" Time will tell if these axioms prove to be as enduring as their sources' founding visions, but kudos to both for continuing to lead with both clarity and purpose during such a tumultuous time. ","url":"https://www.linkedin.com/posts/jeffweiner08_at-a-time-of-unprecedented-rate-of-change-activity-7432607544579084288-sZVy"},{"@type":"WebPage","reviewedBy":{"@type":"Person","name":"Jeff Weiner"},"url":"https://www.linkedin.com/in/jeffweiner08"},{"@context":"http://schema.org","@type":"Person","address":{"@type":"PostalAddress","addressCountry":"US","addressLocality":"United States"},"alumniOf":[{"@type":"Organ ding partner of Next Play Ventures, an early and growth stage venture fund focused on coaching and investing in entrepreneurial leaders building world-class, purpose-driven organizations.\u003Cbr\u003E \u003Cbr\u003EPreviously, Jeff spent over 17 years at LinkedIn, including over 11 years as CEO and six as Executive Chairman. During his tenure as CEO, LinkedIn grew from 338 employees and $78M in revenue to over 16,000 employees and $7.9B in revenue, and expanded its membership from 33M to more than 690M. Throughout, he prioritized LinkedIn's vision of creating economic opportunity for every member of the global workforce.\u003Cbr\u003E\u003Cbr\u003EJeff is also a founding LP and Investment Committee member at Westbound Equity Partners, an early stage fund backing diverse founders and companies serving underserved communities. Additionally, he is co-founder of The Compassion Project, a nonprofit working to ensure compassion is taught in every elementary school in the United States.\u003Cbr\u003E\u003Cbr\u003EEarlier in his career, Jeff was an Executive in Residence at Accel Partners and Greylock Partners, advising consumer technology portfolio companies and evaluating new investments. Before that, he spent seven years at Yahoo!, ultimately serving as EVP of the Network Division, where he led the company's consumer web portfolio including the Front Page, Mail, Search, and Media products.\u003Cbr\u003E\u003Cbr\u003EJeff currently serves on the advisory board of the Boys &amp; Girls Club of the Peninsula and has previously served on the boards of Intuit, DonorsChoose.org, Everfi, and Malaria No More. "}]}
