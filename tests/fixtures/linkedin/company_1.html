      {"@context":"http://schema.org","@graph":[{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Microsoft","url":"https://www.linkedin.com/company/microsoft"},"datePublished":"2026-10-28T23:43:13.504Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":347},"mainEntityOfPage":"https://www.linkedin.com/posts/microsoft_msignite-activity-7521355928982634496-cbcv","text":"Ready for what's next? Microsoft Chairman and CEO Satya Nadella will take the stage at Microsoft Ignite to share the latest innovations shaping what's possible. #MSIgnite","url":"https://www.linkedin.com/posts/microsoft_msignite-activity-7521355928982634496-cbcv"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Microsoft","url":"https://www.linkedin.com/company/microsoft"},"datePublished":"2026-10-27T16:04:37.817Z","headline":"October 2026: The new Copilot","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":902},"mainEntityOfPage":"https://www.linkedin.com/posts/microsoft_october-2026-the-new-copilot-activity-7520878131965091840-mCcZ","text":"Information overload is real. What if you could lighten it?\n \nIn the October edition of The Monthly Tech-In, we explore how AI is increasingly helping people turn mounds of data into action.\n \nAt the office, the new Microsoft Copilot is changing how work gets done. In the field, emergency responders are using Microsoft's HASTE system to analyze cities after natural disasters to see which neighborhoods and roads were hit the hardest. And with an eye toward the moon, NASA is increasingly turning to the technology to extract new insights from its decades of data.\n \nRead on to learn how AI can help distill data in the real world – and beyond it.","url":"https://www.linkedin.com/posts/microsoft_october-2026-the-
